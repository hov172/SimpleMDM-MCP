<style>
  /* Print-ready styling for the SOFA fleet audit report.
     A3 landscape + full page width + dynamic, content-sized columns. */
  @page { size: A3 landscape; margin: 8mm; }

  /* Override pandoc's default narrow centered container so tables use the full width. */
  html, body { max-width: none !important; width: auto !important; margin: 0 !important; padding: 0 !important; }

  body { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 8.5pt; color: #111; }
  h1 { font-size: 17pt; }
  h2 { font-size: 13pt; border-bottom: 1px solid #ccc; margin-top: 16px; }
  h3 { font-size: 11pt; }

  table { border-collapse: collapse; table-layout: auto; width: 100%; margin: 5px 0; }
  th, td { border: 1px solid #ddd; padding: 2px 6px; font-size: 8pt; vertical-align: top; white-space: normal; overflow-wrap: break-word; }
  th { background: #f2f2f2; text-align: left; white-space: nowrap; }
  td { min-width: 44px; }                 /* keep short columns from collapsing too thin */
  tr { page-break-inside: avoid; }

  /* Override pandoc's equal-width colgroup so columns size to their content. */
  colgroup col { width: auto !important; }

  ul { margin: 2px 0 8px 0; }
  li { margin: 1px 0; overflow-wrap: break-word; }
</style>
